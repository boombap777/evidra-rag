# Reference template for switching this project back to cloud providers.
# Replace placeholders before use. The active local deployment uses settings.yaml.

llm:
  provider: "openai"
  model: "gpt-4o"
  api_key: "YOUR_API_KEY_HERE"
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: "openai"
  model: "text-embedding-ada-002"
  dimensions: 1536
  api_key: "YOUR_API_KEY_HERE"

vision_llm:
  enabled: true
  provider: "openai"
  model: "gpt-4o"
  api_key: "YOUR_API_KEY_HERE"
  max_image_size: 2048

vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

retrieval:
  strategy: "dense"
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: "none"
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 100
  chunk_refiner:
    use_llm: true
  metadata_enricher:
    use_llm: true
